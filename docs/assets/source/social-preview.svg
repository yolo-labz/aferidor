<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640"
     role="img" aria-labelledby="og-title og-desc">
  <title id="og-title">aferidor — lê o preço na tela do seu celular e monta o carrinho. Pagar é com você.</title>
  <desc id="og-desc">Cartão do projeto aferidor, marcado como experimental: um agente lê o preço na tela do seu celular e monta o carrinho, e o pagamento continua sendo seu. No rodapé, três fatos: Android físico, dados em texto na sua máquina, e nenhuma ferramenta de pagamento no servidor MCP.</desc>

  <!--
    GitHub social preview, 1280x640 (2:1). This is now the card's ONLY job — the
    README leads with the demo recording instead, so nothing here has to survive
    being embedded on a dark canvas.

    Design constraints, from DESIGN.md and docs/pesquisa:
      - Every crop (X ~1.91:1, Slack, Discord) centre-crops, so nothing
        load-bearing goes near the edges: content sits inside x 88..1192, y 72..568.
      - ONE idea, in type big enough to survive a 600px-wide unfurl. The previous
        version was a four-line checklist; at thumbnail size a list reads as
        texture, not as a sentence. The three supporting facts are deliberately
        small — they reward a click, they do not compete for the first read.
      - The stop is the product, so it is the only coloured line.
      - Text is converted to paths at render time (make assets), so the card does
        not depend on a font being installed anywhere.
      - Maturity is drawn on the artwork: a social card travels alone and cannot
        carry a caveat in prose.
  -->

  <rect width="1280" height="640" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1280" height="10" fill="#1A7F37"/>

  <!-- wordmark -->
  <g transform="translate(88, 92)">
    <g transform="scale(1.5)" fill="#1F2328">
      <path fill-rule="evenodd" d="
        M 12 4 H 26 A 3 3 0 0 1 29 7 V 25 A 3 3 0 0 1 26 28 H 12
        L 2.9 17.8 A 2.7 2.7 0 0 1 2.9 14.2 Z
        M 14.6 16 A 2.6 2.6 0 1 1 9.4 16 A 2.6 2.6 0 1 1 14.6 16 Z
        M 18.866 22.832 L 25.866 11.332 L 23.134 9.668 L 16.134 21.168 Z
      "/>
    </g>
    <text x="70" y="38" font-family="DejaVu Sans, Inter, system-ui, sans-serif"
          font-size="54" font-weight="700" fill="#1F2328" letter-spacing="-1">aferidor</text>
  </g>

  <!-- maturity, on the artwork because the card travels alone -->
  <g transform="translate(960, 96)">
    <rect width="224" height="42" rx="21" fill="#FFFFFF" stroke="#CF222E" stroke-width="2"/>
    <text x="112" y="29" text-anchor="middle"
          font-family="DejaVu Sans, Inter, system-ui, sans-serif"
          font-size="21" font-weight="700" fill="#CF222E">experimental</text>
  </g>

  <!-- the one idea, in three beats -->
  <g font-family="DejaVu Sans, Inter, system-ui, sans-serif" font-size="58" font-weight="700">
    <text x="88" y="284" fill="#1F2328">Lê o preço na tela do seu celular</text>
    <text x="88" y="360" fill="#1F2328">e monta o carrinho.</text>
    <text x="88" y="456" fill="#CF222E">Pagar é com você.</text>
  </g>

  <!-- the small print that rewards a click -->
  <line x1="88" y1="512" x2="1192" y2="512" stroke="#D0D7DE" stroke-width="2"/>
  <g font-family="DejaVu Sans, Inter, system-ui, sans-serif" font-size="24" fill="#57606A">
    <text x="88" y="552">Android físico</text>
    <text x="392" y="552">dados em texto, na sua máquina</text>
    <text x="948" y="552">sem chave de API</text>
  </g>
</svg>
