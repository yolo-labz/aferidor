---
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: tests + lint
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      # The whole project is stdlib Python + one POSIX installer + three small
      # browser-extension files, so the runner needs nothing but what it ships.
      - name: shellcheck
        run: shellcheck -s sh install.sh tests/run.sh

      - name: Python syntax
        run: |
          for f in bin/aferidor bin/aferidor-fone bin/aferidor-mcp; do
            python3 -c "import ast,sys; ast.parse(open(sys.argv[1]).read())" "$f"
          done

      - name: JavaScript syntax
        run: |
          for f in extensao/coletor.js extensao/popup.js; do
            node --check "$f"
          done
          python3 -c "import json;json.load(open('extensao/manifest.json'))"

      # The real gate. Six suites: unit arithmetic plus the migration and
      # replenishment rules, the aferidor-fone payment gate, the MCP protocol AND
      # its no-payment-capability invariant, receipt import idempotency, the
      # extension collector, and a freshly created household repo.
      - name: Test suite
        run: sh tests/run.sh

      # Assets drift silently: a re-render that blows the mobile budget, a
      # palette edit that drops below WCAG AA, or a README Mermaid block that
      # stops matching its source file all look fine in review. This ran only
      # in `make check` locally, so a PR could land any of them. Stdlib only.
      - name: Asset budgets, contrast and manifest
        run: python3 scripts/check-assets.py

      - name: Installer dry run
        run: sh install.sh --dry-run --prefix /tmp/aferidor-ci --casa /tmp/casa-ci

      - name: Installer end to end
        run: |
          AFERIDOR_BINDIR=/tmp/ci-bin AFERIDOR_SKILLDIR=/tmp/ci-skills/x \
            sh install.sh --prefix /tmp/aferidor-e2e --casa /tmp/casa-e2e
          cd /tmp/casa-e2e
          /tmp/ci-bin/aferidor check
          /tmp/ci-bin/aferidor advise
