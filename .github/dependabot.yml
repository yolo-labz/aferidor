---
version: 2
updates:
  # GitHub Actions — weekly. Preserves the `# vX.Y.Z` comment next to each
  # SHA-pinned action so a human reviewer still sees the logical version.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Recife
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies
      - github-actions

# No other ecosystems on purpose: aferidor is standard-library Python with zero
# runtime dependencies, and the browser extension has no build step. There is
# no lockfile to bump because there is nothing to lock.
